name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # For the @plaintx/cache tests. Same image as docker-compose.yml.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: plaintx
          POSTGRES_PASSWORD: plaintx
          POSTGRES_DB: plaintx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plaintx -d plaintx"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://plaintx:plaintx@localhost:5432/plaintx
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
